<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 世界特色美食地圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    :root {
      --bg-canvas: #F9F7F2;
      --bg-ocean: #F0F5F7;
      --land-default: #E5E0D5;
      --land-hover: #D4CDC0;
      --text-primary: #2B2A27;
      --text-secondary: #6E6A63;
      --card-bg: rgba(255, 255, 255, 0.94);
      --border-soft: rgba(43, 42, 39, 0.09);
      --shadow-soft: 0 10px 30px rgba(34, 30, 24, 0.08);
      --shadow-hover: 0 14px 36px rgba(34, 30, 24, 0.14);

      /* 五大美食色彩分類 */
      --cat-grains: #F2A65A;   /* 米麵與主食 */
      --cat-grill: #E06D53;    /* 炙烤與肉食 */
      --cat-spice: #52A87E;    /* 辛香與燉煮 */
      --cat-seafood: #3D98A6;  /* 海味與鮮食 */
      --cat-sweet: #9B72AA;    /* 街頭與甜品 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    /* 頂部標題與篩選列 */
    .top-bar {
      position: fixed;
      top: 18px;
      left: 22px;
      right: 22px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      pointer-events: none;
    }

    .title-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 14px 20px;
      box-shadow: var(--shadow-soft);
      pointer-events: auto;
    }

    .title-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #D96B43;
      background: rgba(217, 107, 67, 0.12);
      padding: 3px 9px;
      border-radius: 99px;
      margin-bottom: 6px;
    }

    .title-card h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-primary);
    }

    .title-card p {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    /* 分類篩選膠囊 */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 8px 10px;
      box-shadow: var(--shadow-soft);
      pointer-events: auto;
      max-width: 620px;
      justify-content: flex-end;
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      background: rgba(43, 42, 39, 0.05);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--text-primary);
      color: #FFFFFF;
    }

    .filter-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* 地圖容器 */
    #map-wrapper {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 45%, #F6F9FA 0%, var(--bg-ocean) 100%);
      position: relative;
      cursor: grab;
    }

    #map-wrapper:active {
      cursor: grabbing;
    }

    svg#world-map {
      width: 100%;
      height: 100%;
      display: block;
    }

    .country {
      stroke: #FFFFFF;
      stroke-width: 0.75px;
      transition: fill 0.25s ease, opacity 0.25s ease, filter 0.2s ease;
      cursor: pointer;
    }

    .country.dimmed {
      opacity: 0.28;
    }

    .country.highlighted {
      filter: brightness(0.92);
      stroke: #2B2A27;
      stroke-width: 1.2px;
    }

    /* 地圖上的精簡美食徽章 */
    .food-marker {
      cursor: pointer;
      transition: opacity 0.25s ease, transform 0.2s ease;
    }

    .food-marker.dimmed {
      opacity: 0.15;
      pointer-events: none;
    }

    .marker-bg {
      fill: #FFFFFF;
      stroke-width: 2px;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.14));
      transition: transform 0.2s ease;
    }

    .food-marker:hover .marker-bg,
    .food-marker.active .marker-bg {
      transform: scale(1.18);
    }

    /* 懸停浮動卡片 (Tooltip) */
    #tooltip {
      position: fixed;
      z-index: 40;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px) scale(0.97);
      transition: opacity 0.18s ease, transform 0.18s ease;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(43, 42, 39, 0.1);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: var(--shadow-hover);
      width: 276px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    #tooltip.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .tooltip-illus {
      width: 68px;
      height: 68px;
      flex-shrink: 0;
      background: #FAF8F4;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(43, 42, 39, 0.06);
      padding: 6px;
    }

    .tooltip-illus svg {
      width: 100%;
      height: 100%;
    }

    .tooltip-body {
      flex: 1;
      min-width: 0;
    }

    .tooltip-country {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tooltip-cat {
      font-size: 10.5px;
      font-weight: 700;
      color: #FFFFFF;
      padding: 2px 7px;
      border-radius: 99px;
      letter-spacing: 0.03em;
    }

    .tooltip-dish {
      font-size: 13.5px;
      font-weight: 700;
      color: #C95B3C;
      margin-top: 3px;
    }

    .tooltip-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.45;
      margin-top: 4px;
    }

    /* 左下角縮放控制 */
    .controls-left {
      position: fixed;
      bottom: 22px;
      left: 22px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .zoom-group {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }

    .ctrl-btn {
      width: 38px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }

    .ctrl-btn + .ctrl-btn {
      border-top: 1px solid var(--border-soft);
    }

    .ctrl-btn:hover {
      background: rgba(43, 42, 39, 0.06);
    }

    .badge-toggle-btn {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: all 0.2s ease;
    }

    .badge-toggle-btn:hover {
      color: var(--text-primary);
      background: #FFFFFF;
    }

    /* 右下角圖例面板 */
    .legend-panel {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 25;
      width: 340px;
      max-height: 410px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: max-height 0.28s ease;
    }

    .legend-panel.collapsed {
      max-height: 48px;
    }

    .legend-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
      flex-shrink: 0;
    }

    .legend-header h2 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .legend-toggle-icon {
      font-size: 12px;
      color: var(--text-secondary);
      transition: transform 0.25s ease;
    }

    .legend-panel.collapsed .legend-toggle-icon {
      transform: rotate(180deg);
    }

    .legend-categories {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      padding: 10px 16px;
      background: rgba(249, 247, 242, 0.7);
      border-bottom: 1px solid var(--border-soft);
      flex-shrink: 0;
    }

    .legend-cat-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .legend-list {
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .legend-list::-webkit-scrollbar {
      width: 5px;
    }

    .legend-list::-webkit-scrollbar-thumb {
      background: rgba(43, 42, 39, 0.16);
      border-radius: 99px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.16s ease, transform 0.16s ease;
    }

    .legend-item:hover,
    .legend-item.active {
      background: rgba(43, 42, 39, 0.055);
    }

    .legend-item.active {
      box-shadow: inset 3px 0 0 #E06D53;
      background: rgba(224, 109, 83, 0.08);
    }

    .legend-item.hidden-by-filter {
      display: none;
    }

    .legend-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: #FAF8F4;
      border: 1px solid rgba(43, 42, 39, 0.07);
      padding: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .legend-icon svg {
      width: 100%;
      height: 100%;
    }

    .legend-info {
      flex: 1;
      min-width: 0;
    }

    .legend-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .legend-dish-name {
      font-weight: 500;
      color: #C95B3C;
    }

    .legend-short-desc {
      font-size: 11.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* 載入與錯誤提示 */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 100;
      transition: opacity 0.35s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(43, 42, 39, 0.12);
      border-top-color: #E06D53;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 820px) {
      .top-bar {
        flex-direction: column;
        align-items: stretch;
        top: 12px;
        left: 12px;
        right: 12px;
      }
      .filter-bar {
        justify-content: flex-start;
        max-width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
      }
      .filter-btn {
        white-space: nowrap;
      }
      .legend-panel {
        width: calc(100vw - 24px);
        right: 12px;
        bottom: 12px;
        max-height: 250px;
      }
      .controls-left {
        bottom: 274px;
        left: 12px;
      }
    }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-size:14px; color:#6E6A63;">正在繪製 2026 世界特色美食地圖...</div>
  </div>

  <!-- 頂部標題與風味篩選 -->
  <header class="top-bar">
    <div class="title-card">
      <span class="title-badge">2026 風味誌 · WORLD CULINARY ATLAS</span>
      <h1>2026 各國特色美食世界地圖</h1>
      <p>滑鼠移至國家探索中文國名與插圖，點擊圖例可快速導覽</p>
    </div>

    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-category="all">全部風味</button>
      <button class="filter-btn" data-category="grains"><span class="filter-dot" style="background:var(--cat-grains)"></span>米麵主食</button>
      <button class="filter-btn" data-category="grill"><span class="filter-dot" style="background:var(--cat-grill)"></span>炙烤肉食</button>
      <button class="filter-btn" data-category="spice"><span class="filter-dot" style="background:var(--cat-spice)"></span>辛香燉煮</button>
      <button class="filter-btn" data-category="seafood"><span class="filter-dot" style="background:var(--cat-seafood)"></span>海味鮮食</button>
      <button class="filter-btn" data-category="sweet"><span class="filter-dot" style="background:var(--cat-sweet)"></span>街頭甜品</button>
    </div>
  </header>

  <!-- 地圖畫布 -->
  <main id="map-wrapper">
    <svg id="world-map"></svg>
  </main>

  <!-- 懸停資訊卡 (國家中文名稱 + 美食插圖) -->
  <div id="tooltip" role="tooltip">
    <div class="tooltip-illus" id="tooltip-illus"></div>
    <div class="tooltip-body">
      <div class="tooltip-country">
        <span id="tooltip-country-name">台灣</span>
        <span class="tooltip-cat" id="tooltip-cat-tag">米麵主食</span>
      </div>
      <div class="tooltip-dish" id="tooltip-dish-name">滷肉飯與珍珠奶茶</div>
      <div class="tooltip-desc" id="tooltip-desc">鹹香滷汁搭Q彈黑糖珍珠，經典街頭靈魂。</div>
    </div>
  </div>

  <!-- 左下角縮放與顯示切換 -->
  <div class="controls-left">
    <div class="zoom-group">
      <button class="ctrl-btn" id="zoom-in" title="放大">+</button>
      <button class="ctrl-btn" id="zoom-out" title="縮小">−</button>
      <button class="ctrl-btn" id="zoom-reset" title="重設視角" style="font-size:13px;">↺</button>
    </div>
    <button class="badge-toggle-btn" id="toggle-markers">隱藏地圖小圖示</button>
  </div>

  <!-- 右下角圖例面板 -->
  <aside class="legend-panel" id="legend-panel">
    <div class="legend-header" id="legend-header">
      <h2>
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#E06D53;"></span>
        各國美食圖例與介紹
      </h2>
      <span class="legend-toggle-icon">▼</span>
    </div>
    <div class="legend-categories">
      <span class="legend-cat-item"><span class="filter-dot" style="background:var(--cat-grains)"></span>米麵主食</span>
      <span class="legend-cat-item"><span class="filter-dot" style="background:var(--cat-grill)"></span>炙烤肉食</span>
      <span class="legend-cat-item"><span class="filter-dot" style="background:var(--cat-spice)"></span>辛香燉煮</span>
      <span class="legend-cat-item"><span class="filter-dot" style="background:var(--cat-seafood)"></span>海味鮮食</span>
      <span class="legend-cat-item"><span class="filter-dot" style="background:var(--cat-sweet)"></span>街頭甜品</span>
    </div>
    <div class="legend-list" id="legend-list"></div>
  </aside>

  <script>
    // 1. 風味分類設定
    const CATEGORIES = {
      grains:  { label: '米麵主食', color: '#F2A65A' },

      spice:   { label: '辛香燉煮', color: '#52A87E' },

      korea: `<svg viewBox="0 0 64 64" fill="none">

        <path d="M37 27c4-2 9 0 11 3" stroke="#F2A65A" stroke-width="4" stroke-linecap="round"/>
        <path d="M19 34c4 2 9 2 12 0" stroke="#E06D53" stroke-width="4" stroke-linecap="round"/>
        <circle cx="32" cy="29" r="7" fill="#FFFFFF" stroke="#E5DFD3" stroke-width="1.2"/>
        <circle cx="32" cy="29" r="3.8" fill="#F7B731"/>
      </svg>`,

    function getCountryDisplayData(feature) {
      const id = String(feature.id || '').padStart(3, '0');
      if (FEATURED_BY_ID[id]) {
        const c = FEATURED_BY_ID[id];
        return {
          isFeatured: true,
          id,
          nameZh: c.nameZh,
          dish: c.dish,
          desc: c.detailDesc,
          category: c.category,
          svg: c.svg
        };
      }

      const nameZh = EXTRA_COUNTRY_ZH[id] || feature.properties?.name || '探索地區';
      if (EXTRA_FOOD_HINTS[id]) {
        const h = EXTRA_FOOD_HINTS[id];
        return {
          isFeatured: false,
          id,
          nameZh,
          dish: h.dish,
          desc: h.desc,
          category: null,
          svg: h.svg
        };
      }

      // 依經度/緯度給與對應區域美食插圖
      const centroid = d3.geoCentroid(feature);
      const [lon, lat] = centroid;
      let svg = 'regional_europe';
      let dish = '在地傳統家常料理';
      if (lon < -30) {
        svg = 'regional_americas';
        dish = '美洲地方特色烤肉與玉米料理';
      } else if (lon > 60 && lat > 0) {
        svg = 'regional_asia';
        dish = '亞洲香料米麵與傳統風味';
      } else if (lat < 33 && lon > -20 && lon < 60) {
        svg = 'regional_africa';
        dish = '傳統燉煮與地方穀物料理';
      }

      return {
        isFeatured: false,
        id,
        nameZh,
        dish,
        desc: '保留當地風土與世代傳承的特色風味料理。',
        category: null,
        svg
      };
    }

    // 5. 初始化地圖與互動
    const svg = d3.select('#world-map');
    const width = window.innerWidth;
    const height = window.innerHeight;
    svg.attr('viewBox', `0 0 ${width} ${height}`);

    const gMap = svg.append('g');
    const countriesGroup = gMap.append('g').attr('class', 'countries-layer');
    const markersGroup = gMap.append('g').attr('class', 'markers-layer');

    const projection = d3.geoNaturalEarth1()
      .scale(Math.min(width / 5.4, height / 2.85))
      .translate([width / 2, height / 2 + 22]);

    const pathGenerator = d3.geoPath().projection(projection);

    let activeCategory = 'all';
    let showMarkers = true;

    // 縮放與平移
    const zoom = d3.zoom()
      .scaleExtent([1, 7])
      .on('zoom', (event) => {
        gMap.attr('transform', event.transform);
        const k = event.transform.k;
        markersGroup.selectAll('.food-marker')
          .attr('transform', d => {
            const [x, y] = projection(d.coords);
            return `translate(${x}, ${y}) scale(${1 / Math.pow(k, 0.55)})`;
          });
      });

    svg.call(zoom);

    // 懸停提示控制
    const tooltip = document.getElementById('tooltip');
    const tooltipIllus = document.getElementById('tooltip-illus');
    const tooltipCountryName = document.getElementById('tooltip-country-name');
    const tooltipCatTag = document.getElementById('tooltip-cat-tag');
    const tooltipDishName = document.getElementById('tooltip-dish-name');
    const tooltipDesc = document.getElementById('tooltip-desc');

    function showTooltip(data, clientX, clientY) {
      tooltipIllus.innerHTML = FOOD_SVGS[data.svg] || FOOD_SVGS.regional_europe;
      tooltipCountryName.textContent = data.nameZh;
      tooltipDishName.textContent = data.dish;
      tooltipDesc.textContent = data.desc;

      if (data.category && CATEGORIES[data.category]) {
        const cat = CATEGORIES[data.category];
        tooltipCatTag.style.display = 'inline-block';
        tooltipCatTag.style.backgroundColor = cat.color;
        tooltipCatTag.textContent = cat.label;
      } else {
        tooltipCatTag.style.display = 'inline-block';
        tooltipCatTag.style.backgroundColor = '#8E887E';
        tooltipCatTag.textContent = '地方風味';
      }

      tooltip.classList.add('visible');
      positionTooltip(clientX, clientY);
    }

    function positionTooltip(x, y) {
      const tw = 280;
      const th = 126;
      const pad = 16;
      let left = x + 18;
      let top = y - th / 2;

      if (left + tw > window.innerWidth - pad) {
        left = x - tw - 18;
      }
      if (top < pad) top = pad;
      if (top + th > window.innerHeight - pad) {
        top = window.innerHeight - th - pad;
      }

      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
      tooltip.classList.remove('visible');
    }

    function setActiveHighlight(countryId) {
      countriesGroup.selectAll('.country')
        .classed('highlighted', d => String(d.id).padStart(3, '0') === countryId);
      markersGroup.selectAll('.food-marker')
        .classed('active', d => d.id === countryId);

      document.querySelectorAll('.legend-item').forEach(el => {
        const match = el.dataset.id === countryId;
        el.classList.toggle('active', match);
        if (match) {
          el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      });
    }

    function clearActiveHighlight() {
      countriesGroup.selectAll('.country').classed('highlighted', false);
      markersGroup.selectAll('.food-marker').classed('active', false);
      document.querySelectorAll('.legend-item').forEach(el => el.classList.remove('active'));
    }

    // 建立右下角圖例清單
    function renderLegend() {
      const listEl = document.getElementById('legend-list');
      listEl.innerHTML = '';

      FEATURED_COUNTRIES.forEach(item => {
        const div = document.createElement('div');
        div.className = 'legend-item';
        div.dataset.id = item.id;
        div.dataset.category = item.category;

        div.innerHTML = `
          <div class="legend-icon">${FOOD_SVGS[item.svg]}</div>
          <div class="legend-info">
            <div class="legend-title-row">
              <span class="filter-dot" style="background:${CATEGORIES[item.category].color}; width:7px; height:7px;"></span>
              <span>${item.nameZh}</span>
              <span class="legend-dish-name">· ${item.dish}</span>
            </div>
            <div class="legend-short-desc">${item.shortDesc}</div>
          </div>
        `;

        div.addEventListener('mouseenter', () => {
          setActiveHighlight(item.id);
          const [px, py] = projection(item.coords);
          const transform = d3.zoomTransform(svg.node());
          const screenX = transform.applyX(px);
          const screenY = transform.applyY(py);
          showTooltip({
            isFeatured: true,
            id: item.id,
            nameZh: item.nameZh,
            dish: item.dish,
            desc: item.detailDesc,
            category: item.category,
            svg: item.svg
          }, screenX, screenY);
        });

        div.addEventListener('mouseleave', () => {
          clearActiveHighlight();
          hideTooltip();
        });

        div.addEventListener('click', () => {
          const [px, py] = projection(item.coords);
          const scale = 2.4;
          svg.transition().duration(650).call(
            zoom.transform,
            d3.zoomIdentity.translate(width / 2 - px * scale, height / 2 - py * scale).scale(scale)
          );
        });

        listEl.appendChild(div);
      });
    }

    // 套用分類篩選
    function applyFilter(category) {
      activeCategory = category;

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.category === category);
      });

      countriesGroup.selectAll('.country').classed('dimmed', d => {
        if (category === 'all') return false;
        const id = String(d.id).padStart(3, '0');
        const feat = FEATURED_BY_ID[id];
        return !feat || feat.category !== category;
      });

      markersGroup.selectAll('.food-marker').classed('dimmed', d => {
        return category !== 'all' && d.category !== category;
      });

      document.querySelectorAll('.legend-item').forEach(el => {
        const match = category === 'all' || el.dataset.category === category;
        el.classList.toggle('hidden-by-filter', !match);
      });
    }

    // 載入世界地圖 TopoJSON
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(res => {
        if (!res.ok) throw new Error('無法載入地圖資料');
        return res.json();
      })
      .then(world => {
        const countries = topojson.feature(world, world.objects.countries).features
          .filter(d => String(d.id).padStart(3, '0') !== '010'); // 隱藏南極洲讓構圖更聚焦

        // 繪製國家多邊形
        countriesGroup.selectAll('path')
          .data(countries)
          .join('path')
          .attr('class', 'country')
          .attr('d', pathGenerator)
          .attr('fill', d => {
            const id = String(d.id).padStart(3, '0');
            const feat = FEATURED_BY_ID[id];
            return feat ? CATEGORIES[feat.category].color : '#E5E0D5';
          })
          .on('mouseenter', function(event, d) {
            const data = getCountryDisplayData(d);
            setActiveHighlight(data.id);
            if (!data.isFeatured) {
              d3.select(this).attr('fill', '#D4CDC0');
            }
            showTooltip(data, event.clientX, event.clientY);
          })
          .on('mousemove', function(event) {
            positionTooltip(event.clientX, event.clientY);
          })
          .on('mouseleave', function(event, d) {
            const id = String(d.id).padStart(3, '0');
            if (!FEATURED_BY_ID[id]) {
              d3.select(this).attr('fill', '#E5E0D5');
            }
            clearActiveHighlight();
            hideTooltip();
          });

        // 繪製地圖上的精簡圓形美食徽章
        const markerNodes = markersGroup.selectAll('g.food-marker')
          .data(FEATURED_COUNTRIES)
          .join('g')
          .attr('class', 'food-marker')
          .attr('transform', d => {
            const [x, y] = projection(d.coords);
            return `translate(${x}, ${y})`;
          });

        markerNodes.append('circle')
          .attr('class', 'marker-bg')
          .attr('r', 12.5)
          .attr('stroke', d => CATEGORIES[d.category].color);

        markerNodes.append('g')
          .attr('transform', 'translate(-9, -9) scale(0.28)')
          .html(d => FOOD_SVGS[d.svg]);

        markerNodes
          .on('mouseenter', function(event, d) {
            event.stopPropagation();
            setActiveHighlight(d.id);
            showTooltip({
              isFeatured: true,
              id: d.id,
              nameZh: d.nameZh,
              dish: d.dish,
              desc: d.detailDesc,
              category: d.category,
              svg: d.svg
            }, event.clientX, event.clientY);
          })
          .on('mousemove', (event) => positionTooltip(event.clientX, event.clientY))
          .on('mouseleave', () => {
            clearActiveHighlight();
            hideTooltip();
          });

        renderLegend();
        document.getElementById('loading-overlay').classList.add('hidden');
      })
      .catch(err => {
        document.getElementById('loading-overlay').innerHTML = `
          <div style="color:#E06D53; font-weight:700;">地圖載入失敗</div>
          <div style="font-size:13px; color:#6E6A63;">請確認網路連線後重新整理頁面（${err.message}）</div>
        `;
      });

    // 綁定上方篩選按鈕
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => applyFilter(btn.dataset.category));
    });

    // 綁定左下角控制項
    document.getElementById('zoom-in').addEventListener('click', () => {
      svg.transition().duration(300).call(zoom.scaleBy, 1.45);
    });
    document.getElementById('zoom-out').addEventListener('click', () => {
      svg.transition().duration(300).call(zoom.scaleBy, 0.7);
    });
    document.getElementById('zoom-reset').addEventListener('click', () => {
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    });

    const toggleMarkersBtn = document.getElementById('toggle-markers');
    toggleMarkersBtn.addEventListener('click', () => {
      showMarkers = !showMarkers;
      markersGroup.style('display', showMarkers ? null : 'none');
      toggleMarkersBtn.textContent = showMarkers ? '隱藏地圖小圖示' : '顯示地圖小圖示';
    });

    // 綁定右下角圖例收合
    document.getElementById('legend-header').addEventListener('click', () => {
      document.getElementById('legend-panel').classList.toggle('collapsed');
    });
  </script>
</body>
</html>
