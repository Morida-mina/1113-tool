
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRUTH or DARE 真心話大冒險</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg,#21113e,#733bb1,#ee82b9);
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  color: white;
  display: grid;
  place-items: center;
  padding: 18px;
}

.card {
  width: min(100%, 440px);
  padding: 24px;
  background: #241238e8;
  border: 1px solid #ffffff55;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 20px 45px #160c2666;
}

h1 { font-size: 32px; margin: 8px 0; }
p { color: #eedcff; }

label {
  display: block;
  text-align: left;
  font-weight: bold;
}

select, textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0 14px;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
}

.wheel-wrap {
  position: relative;
  width: 235px;
  height: 250px;
  margin: 12px auto;
}

.arrow {
  position: absolute;
  top: 0;
  left: calc(50% - 13px);
  z-index: 2;
  font-size: 28px;
}

.wheel {
  position: absolute;
  top: 24px;
  left: 3px;
  width: 229px;
  height: 229px;
  border: 7px solid white;
  border-radius: 50%;
  background: conic-gradient(
    from -90deg,
    #fa6da5 0deg 180deg,
    #8055eb 180deg 360deg
  );
  transition: transform 2.8s cubic-bezier(.12,.76,.18,1);
}

.wheel b {
  position: absolute;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 20px;
}

.top { top: 41px; }
.bottom { bottom: 41px; }

button {
  border: 0;
  border-radius: 14px;
  background: #ffda70;
  color: #321c4a;
  padding: 13px 16px;
  margin: 5px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.other { background: #e5c8ff; }
button:disabled { opacity: .5; }

.result {
  background: #ffffff23;
  border-radius: 14px;
  min-height: 100px;
  padding: 18px;
  margin: 16px 0;
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: bold;
}

small { color: #e9d4f9; }
</style>
</head>

<body>
<div class="card">

  <h1>🎲 TRUTH or DARE</h1>
  <p>真心話大冒險・命運挑戰局</p>

  <label>選擇玩法</label>
  <select id="mode">
    <option value="random">隨機決定</option>
    <option value="truth">只抽真心話</option>
    <option value="dare">只抽大冒險</option>
  </select>

  <label>選擇辣度</label>
  <select id="level">
    <option value="easy">🙂 普通</option>
    <option value="medium">🌶️ 微辣</option>
    <option value="hot">🔥 辛辣</option>
  </select>

  <div class="wheel-wrap">
    <div class="arrow">▼</div>
    <div class="wheel" id="wheel">
      <b class="top">💗 真心話</b>
      <b class="bottom">⚡ 大冒險</b>
    </div>
  </div>

  <button id="spin" onclick="spinWheel()">
    🎡 轉動輪盤
  </button>

  <button class="other" onclick="draw()">
    🎴 直接抽籤
  </button>

  <div class="result" id="result">
    準備好了嗎？開始挑戰！
  </div>

  <label>問題回報</label>
  <textarea id="feedback" rows="2"
    placeholder="例如：某題不適合或按鈕無法使用"></textarea>

  <button class="other" onclick="reportIssue()">
    💬 問題回報
  </button>

  <div>
    <small id="status">目前為網頁試玩模式</small>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
// 後續會填入真正的 LINE 資料
const LIFF_ID = 'YOUR_LIFF_ID';
const OA_ID = '@YOUR_OA_ID';

// 遊戲題庫
const questions = {
  truth: {
    easy: [
      '你最尷尬的一次經驗是什麼？',
      '你最想去旅行的國家？',
      '你小時候最害怕什麼？'
    ],
    medium: [
      '你曾經偷偷喜歡過誰嗎？',
      '說出一件朋友不知道的秘密。',
      '你最後一次說善意的謊言是什麼時候？'
    ],
    hot: [
      '你最想和現場哪個人單獨約會？',
      '你曾經因為吃醋做過什麼事？',
      '你最不敢傳出去的一句訊息是什麼？'
    ]
  },
  dare: {
    easy: [
      '模仿一種動物15秒。',
      '用唱歌的方式介紹自己。',
      '做出最奇怪的自拍表情。'
    ],
    medium: [
      '用偶像劇語氣講一句告白台詞。',
      '讓大家幫你選一個搞笑綽號。',
      '模仿現場某位朋友的招牌動作。'
    ],
    hot: [
      '對現場一個人說出三個真誠優點。',
      '用最深情的眼神看著空氣演戲20秒。',
      '即興演出被暗戀對象拒絕的劇情。'
    ]
  }
};

const used = new Set();
let angle = 0;
let spinning = false;

function choice(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function selectedType() {
  const value = document.getElementById('mode').value;
  return value === 'random'
    ? choice(['truth', 'dare'])
    : value;
}

// 抽取不重複的題目
function showQuestion(type) {
  const level = document.getElementById('level').value;
  const pool = questions[type][level];
  const key = type + ':' + level + ':';

  let available = pool.filter(q => !used.has(key + q));

  if (!available.length) {
    pool.forEach(q => used.delete(key + q));
    available = pool;
  }

  const question = choice(available);
  used.add(key + question);

  document.getElementById('result').textContent =
    (type === 'truth' ? '💗 真心話：' : '⚡ 大冒險：')
    + question;
}

// 直接抽籤
function draw() {
  if (!spinning) showQuestion(selectedType());
}

// 轉動輪盤
function spinWheel() {
  if (spinning) return;

  spinning = true;
  const type = selectedType();
  const target = type === 'truth' ? 0 : 180;

  angle += 1800 + ((target - angle % 360 + 360) % 360);

  document.getElementById('wheel').style.transform =
    `rotate(${angle}deg)`;

  document.getElementById('spin').disabled = true;
  document.getElementById('result').textContent =
    '輪盤旋轉中…';

  setTimeout(() => {
    showQuestion(type);
    spinning = false;
    document.getElementById('spin').disabled = false;
  }, 2900);
}

// 問題回報
function reportIssue() {
  const issue = document.getElementById('feedback').value.trim();

  if (!issue) {
    alert('請先輸入問題內容');
    return;
  }

  const msg = '【真心話大冒險問題回報】\n' + issue;

  if (OA_ID === '@YOUR_OA_ID') {
    prompt('尚未設定官方帳號，先複製內容：', msg);
    return;
  }

  location.href =
    'https://line.me/R/oaMessage/' +
    encodeURIComponent(OA_ID) +
    '/?' + encodeURIComponent(msg);
}

// 初始化 LIFF
if (LIFF_ID !== 'YOUR_LIFF_ID' && window.liff) {
  liff.init({ liffId: LIFF_ID })
    .then(() => {
      document.getElementById('status').textContent =
        liff.isInClient()
          ? '✅ 已在 LINE LIFF 中開啟'
          : '✅ LIFF 已啟動';
    })
    .catch(() => {
      document.getElementById('status').textContent =
        '⚠️ LIFF 初始化失敗';
    });
}
</script>
</body>
</html>
